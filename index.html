<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cara ou Coroa</title>
<meta name="description" content="Uma moeda. Uma sala branca infinita. Um botão.">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="css/style.css">
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "fbd215c108ed4c8486694c6825f709f1"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>

  <!-- .sala é a câmera: a perspectiva mora aqui.
       .rig  é o movimento de câmera (afastar, inclinar).
       .arco é a posição da moeda no espaço (a parábola).
       .moeda é só o giro. Cada camada tem uma responsabilidade. -->
  <div class="sala" id="sala">
    <div class="rig" id="rig">
      <div class="sombra" id="sombra"></div>
      <div class="arco" id="arco">
        <div class="moeda" id="moeda">
          <img class="face frente" id="faceCara" alt="" src="" draggable="false">
          <img class="face verso"  id="faceCoroa" alt="" src="" draggable="false">
          <div class="canto" id="canto"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="ui">
    <header class="topo">
      <span class="rotulo" id="denominacao">—</span>
      <div class="direita">
        <!-- Botão de som. Estado (mudo ou não) vive em js/som.js e persiste
             via localStorage; aqui só refletimos aria-pressed/aria-label. -->
        <button id="somToggle" class="som" type="button" aria-pressed="false" aria-label="Silenciar">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none"
               stroke="currentColor" stroke-width="1.3"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.6 6.2h2.4L7.6 3v10L4 9.8H1.6z" fill="currentColor" stroke="none"/>
            <path class="onda onda1" d="M10.2 5.4a4 4 0 0 1 0 5.2"/>
            <path class="onda onda2" d="M12 3.6a7 7 0 0 1 0 8.8"/>
            <path class="mudox" d="M10.1 5.3l4 5.4M14.1 5.3l-4 5.4"/>
          </svg>
        </button>
        <!-- Placar. aria-hidden porque o resultado já é anunciado por #anuncio;
             sem isto o leitor de tela leria a contagem duas vezes. -->
        <span class="placar" aria-hidden="true">
          <span class="marca">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none"
                 stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
              <circle cx="8" cy="5.5" r="2.9"/>
              <path d="M2.6 14c.7-3 2.9-4.5 5.4-4.5s4.7 1.5 5.4 4.5"/>
            </svg>
            <b id="nCara">0</b>
          </span>
          <span class="marca">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none"
                 stroke="currentColor" stroke-width="1.3"
                 stroke-linejoin="round" stroke-linecap="round">
              <path d="M2.4 12.1 1.5 4.8l3.6 2.5L8 3.1l2.9 4.2 3.6-2.5-.9 7.3z"/>
              <path d="M2.7 14.2h10.6"/>
            </svg>
            <b id="nCoroa">0</b>
          </span>
        </span>
      </div>
    </header>
    <footer class="rodape">
      <button id="jogar" type="button">Jogar</button>
      <p class="dica" id="dica">recarregue para trocar de moeda</p>
    </footer>
  </div>

  <!-- O resultado não aparece na tela: quem enxerga lê na própria moeda.
       Este parágrafo é invisível e existe para leitores de tela — sem ele,
       a jogada não teria resultado nenhum para quem não vê. -->
  <p class="apenas-leitor" role="status" aria-live="polite" id="anuncio"></p>

  <script src="js/som.js"></script>
  <script src="js/moeda.js"></script>
</body>
</html>
